# Explicit opt-in test overlay. The production compose file has only one service.
services:
  app:
    ports: !override
      - "127.0.0.1:18080:8000"
    environment:
      KEITARO_BASE_URL: http://fixture:8081
      KEITARO_API_KEY: fixture-only-secret
      APP_ORIGIN: http://127.0.0.1:18080
      CREATOR_DOMAIN_ID: '2'
      CREATOR_GROUP_ID: '3'
      CREATOR_TRAFFIC_SOURCE_ID: '4'
      CREATOR_NAME_PREFIX: test_example_
    depends_on:
      - fixture
  fixture:
    image: python:3.13-slim
    command: ["python", "/fixture/server.py"]
    volumes:
      - ./tests/fixture_server.py:/fixture/server.py:ro
    ports:
      - "127.0.0.1:18081:8081"
