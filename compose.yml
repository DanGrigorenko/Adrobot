services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      KEITARO_BASE_URL: ${KEITARO_BASE_URL:-https://keitaro.example}
      KEITARO_API_KEY: ${KEITARO_API_KEY:-}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:8000}
      CREATOR_DOMAIN_ID: ${CREATOR_DOMAIN_ID:-}
      CREATOR_GROUP_ID: ${CREATOR_GROUP_ID:-}
      CREATOR_TRAFFIC_SOURCE_ID: ${CREATOR_TRAFFIC_SOURCE_ID:-}
      CREATOR_NAME_PREFIX: ${CREATOR_NAME_PREFIX:-}
      DATABASE_URL: sqlite:////data/adrobot.sqlite
    volumes:
      - sqlite-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  sqlite-data:
